# -Djava.net.preferIPv4Stack=true works around a common failure mode on networks where
# IPv6 is advertised but doesn't actually route: Java's plain socket stack (unlike a
# browser's Happy-Eyeballs fallback) can get stuck on the broken IPv6 address Maven/dl.google.com
# resolves to instead of falling back to the working IPv4 one, breaking dependency downloads.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true

# Flutter
flutter.sdk.validation.timeout=300000

# Opt out of AGP 9+'s new build-file DSL (this project's Groovy build.gradle files aren't
# written for it yet) and Flutter's built-in Kotlin handling (this project applies its own
# kotlin-android plugin already) -- both flagged by Flutter's own build-dependency check.
android.newDsl=false
android.builtInKotlin=false
