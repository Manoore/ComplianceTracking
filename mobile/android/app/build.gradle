plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.complinow.compliance_track_mobile"

    // Target the latest stable Android SDK
    compileSdk = flutter.compileSdkVersion

    // Highest NDK version any plugin in this project's dependency tree requires
    // (currently package:jni, pulled in transitively) -- NDKs are backward compatible,
    // so pinning to the highest required version satisfies every plugin at once.
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        // Google Play: must be unique, reverse-DNS format
        applicationId "com.complinow.app"

        // Minimum Android 6.0 (Marshmallow) — covers 99%+ of active devices
        // Needed for runtime permissions (camera, location)
        minSdkVersion 23

        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName

        // Enable multidex for large dependency tree
        multiDexEnabled true
    }

    signingConfigs {
        release {
            // ── Production signing ──
            // Set these via environment variables in CI/CD pipeline:
            //   KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
            // Never commit the actual keystore or credentials to git.
            //
            // This block is evaluated by Gradle during project configuration for every
            // task -- including `assembleDebug` -- not just when actually building a
            // release variant. So it must not throw when the env vars are unset; it just
            // leaves this signing config incomplete, and Gradle/AGP itself will refuse to
            // produce a release build with an incomplete signing config, with its own
            // clear error, the moment someone actually runs assembleRelease/bundleRelease.
            // Named releaseKeyAlias/releaseKeyPassword, not keyAlias/keyPassword -- a local
            // variable with the exact same name as the keyAlias()/keyPassword() DSL setter
            // it's passed to confuses Groovy's dynamic dispatch (it resolves `keyAlias` as
            // the variable even in call position, then tries to call() the resulting String,
            // throwing "No signature of method: java.lang.String.call()").
            def keystorePath = System.getenv("KEYSTORE_PATH")
            def keystorePassword = System.getenv("KEYSTORE_PASSWORD")
            def releaseKeyAlias = System.getenv("KEY_ALIAS")
            def releaseKeyPassword = System.getenv("KEY_PASSWORD")

            if (keystorePath == null || keystorePassword == null || releaseKeyAlias == null || releaseKeyPassword == null) {
                return
            }

            storeFile file(keystorePath)
            storePassword keystorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }

        release {
            // Use production signing for release builds
            signingConfig signingConfigs.release

            // Enable code shrinking and obfuscation (Play Store recommended)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }

        profile {
            initWith debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "androidx.multidex:multidex:2.0.1"
}
