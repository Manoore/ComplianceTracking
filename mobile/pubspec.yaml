version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  go_router: ^14.2.7
  provider: ^6.1.2
